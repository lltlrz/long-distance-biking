<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>骑迹计划 Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">骑</span>
        <div>
          <h1>骑迹计划</h1>
          <p>长途骑行补给感知与分日路线规划</p>
        </div>
      </div>
      <nav class="top-actions" aria-label="Demo 操作">
        <button class="ghost-button" id="resetButton" type="button">重置</button>
        <button class="primary-button" id="saveButton" type="button">保存行程</button>
      </nav>
    </header>

    <main class="workspace">
      <aside class="planner-panel" aria-label="路线规划设置">
        <section class="panel-section">
          <div class="section-heading">
            <h2>规划条件</h2>
            <span class="status-dot">可生成</span>
          </div>

          <label class="field-label" for="startInput">起点</label>
          <input id="startInput" class="text-input" value="成都" autocomplete="off">

          <label class="field-label" for="endInput">终点</label>
          <input id="endInput" class="text-input" value="乐山" autocomplete="off">

          <div class="two-col">
            <div>
              <label class="field-label" for="daysInput">计划天数</label>
              <input id="daysInput" class="text-input" type="number" min="2" max="6" value="3">
            </div>
            <div>
              <label class="field-label" for="distanceInput">总里程</label>
              <input id="distanceInput" class="text-input" type="number" min="120" max="520" value="246">
            </div>
          </div>
        </section>

        <section class="panel-section">
          <h2>骑行强度</h2>
          <div class="segmented" role="radiogroup" aria-label="骑行强度">
            <button class="segment" data-intensity="easy" type="button">轻松</button>
            <button class="segment active" data-intensity="standard" type="button">标准</button>
            <button class="segment" data-intensity="challenge" type="button">挑战</button>
          </div>
          <p class="helper-text" id="intensityHelp">标准：每日约 70-100km，适合有一定骑行基础的用户。</p>
        </section>

        <section class="panel-section">
          <h2>路线偏好</h2>
          <div class="preference-list">
            <label><input type="checkbox" value="hotel" checked> 住宿优先</label>
            <label><input type="checkbox" value="supply" checked> 补给优先</label>
            <label><input type="checkbox" value="safe" checked> 安全优先</label>
            <label><input type="checkbox" value="climb"> 少爬升</label>
          </div>
        </section>

        <button class="generate-button" id="generateButton" type="button">生成骑行计划</button>

        <section class="panel-section compact">
          <h2>规划结果</h2>
          <dl class="summary-list">
            <div><dt>日均里程</dt><dd id="avgDistance">82km</dd></div>
            <div><dt>补给空窗</dt><dd id="gapCount">2 段</dd></div>
            <div><dt>综合风险</dt><dd id="riskLevel">中</dd></div>
          </dl>
        </section>
      </aside>

      <section class="map-stage" aria-label="路线地图预览">
        <div class="map-toolbar">
          <div class="route-title">
            <h2 id="routeTitle">成都 → 乐山 · 3 日</h2>
            <p id="routeSubtitle">246km · 预计总骑行 18.5h · 推荐标准强度</p>
          </div>
          <div class="layer-toggles" aria-label="补给图层筛选">
            <button class="layer active" data-layer="food" type="button">餐饮</button>
            <button class="layer active" data-layer="store" type="button">便利店</button>
            <button class="layer active" data-layer="hotel" type="button">住宿</button>
            <button class="layer active" data-layer="town" type="button">城镇</button>
          </div>
        </div>

        <div class="map-canvas" id="mapCanvas">
          <svg class="route-svg" viewBox="0 0 900 560" role="img" aria-label="模拟骑行路线地图">
            <defs>
              <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18443f" flood-opacity="0.18"/>
              </filter>
            </defs>
            <path class="terrain-line line-a" d="M40 88 C160 46 250 104 340 70 S520 50 640 98 S780 122 860 70"/>
            <path class="terrain-line line-b" d="M30 430 C180 380 260 480 390 424 S560 372 700 420 S800 492 870 430"/>
            <path class="minor-road" d="M110 130 C160 210 220 260 310 278 S500 330 606 382"/>
            <path class="minor-road" d="M310 92 C348 180 430 230 520 262 S690 326 820 306"/>
            <path class="route-base" d="M90 450 C140 378 172 322 250 292 S372 268 438 214 S552 112 650 142 S750 258 815 105"/>
            <path class="route-risk" d="M488 174 C535 132 590 124 650 142"/>
            <path class="route-day day-one" d="M90 450 C140 378 172 322 250 292"/>
            <path class="route-day day-two" d="M250 292 C372 268 438 214 488 174"/>
            <path class="route-day day-three" d="M650 142 C730 210 765 180 815 105"/>
          </svg>

          <div class="map-label city start" style="left:8%; top:78%">成都</div>
          <div class="map-label city" style="left:28%; top:50%">眉山</div>
          <div class="map-label town" style="left:54%; top:31%">夹江</div>
          <div class="map-label city end" style="left:82%; top:17%">乐山</div>

          <button class="poi food" data-layer-marker="food" style="left:22%; top:61%" type="button" aria-label="餐饮补给点">餐</button>
          <button class="poi store" data-layer-marker="store" style="left:34%; top:48%" type="button" aria-label="便利店补给点">便</button>
          <button class="poi hotel" data-layer-marker="hotel" style="left:29%; top:54%" type="button" aria-label="住宿补给点">住</button>
          <button class="poi town" data-layer-marker="town" style="left:50%; top:37%" type="button" aria-label="城镇补给点">镇</button>
          <button class="poi store" data-layer-marker="store" style="left:70%; top:35%" type="button" aria-label="便利店补给点">便</button>
          <button class="poi food" data-layer-marker="food" style="left:76%; top:28%" type="button" aria-label="餐饮补给点">餐</button>
          <button class="poi hotel" data-layer-marker="hotel" style="left:84%; top:22%" type="button" aria-label="住宿补给点">住</button>

          <div class="risk-callout" id="riskCallout">
            <strong>补给空窗 31km</strong>
            <span>夹江前后国道路段，建议白天通过并提前补水。</span>
          </div>
        </div>

        <div class="map-footer">
          <div><span class="legend route"></span>推荐骑行路线</div>
          <div><span class="legend gap"></span>补给空窗</div>
          <div><span class="legend supply"></span>沿途补给</div>
        </div>
      </section>

      <aside class="detail-panel" aria-label="每日行程详情">
        <section class="panel-section day-summary">
          <div class="section-heading">
            <h2>每日行程</h2>
            <button class="text-button" id="adjustButton" type="button">调整终点</button>
          </div>
          <div id="dayCards" class="day-cards"></div>
        </section>

        <section class="panel-section">
          <h2>补给与安全提醒</h2>
          <div class="warning-list" id="warningList"></div>
        </section>

        <section class="panel-section compact">
          <h2>埋点预览</h2>
          <div class="event-log" id="eventLog" aria-live="polite"></div>
        </section>
      </aside>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">行程已保存</div>
  <script src="script.js"></script>
  <script src="agent.js"></script>
</body>
</html>
